<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Segurança: só carrega scripts e estilos do próprio app. Imagens: as do app e as dos jogos (o protocolo
      playtrove-img do Rust, http://playtrove-img.localhost). Conexões: as do app e a ponte com o Rust (ipc:).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://playtrove-img.localhost; media-src http://playtrove-video.localhost http://playtrove-music.localhost http://playtrove-music-preview.localhost; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>Playtrove</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
