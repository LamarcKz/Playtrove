# O Playtrove em Tauri: a parte de trás do app (banco, emuladores, metadados, conquistas...), em Rust.
# A interface continua em React (src/renderer). A versão do app vem do package.json (tauri.conf.json).
[package]
name = "playtrove"
version = "0.0.0"
description = "Your game library for Windows: emulators, achievements and playtime in one place."
authors = ["LamarcKz"]
license = "MIT"
repository = "https://github.com/LamarcKz/Playtrove"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = { version = "0.11.1", features = ["getrandom"] }
base64 = "0.22"
chrono = "0.4.45"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sys-locale = "0.3.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
unicode-normalization = "0.1.26"
ureq = "3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Shutdown", "Win32_System_Power", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Devices_HumanInterfaceDevice"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }

# Os programas que compilam as dependências (build scripts) saem com as informações de depuração também no
# build de release, como no de desenvolvimento: sem elas, o Smart App Control do Windows bloqueou um deles
# (o do serde_core) num computador com ele ligado. O app em si não muda.
[profile.release.build-override]
debug = true
