# O robô dos testes: a cada envio para a main ou para a desenvolvimento, e a cada Pull Request, o
# GitHub liga um Windows limpo, instala o projeto do zero e roda todos os testes (npm test). O
# resultado vira o selo ✓ ou ✗ ao lado do commit e nos Pull Requests; cada rodada fica na aba Actions.
name: Tests

on:
  push:
    branches: [main, desenvolvimento]
  pull_request:

# O robô só lê o repositório.
permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # O npm ci instala exatamente o que está no package-lock.json. Os scripts de instalação negados no
      # allowScripts (package.json) não rodam.
      - name: Install dependencies
        run: npm ci

      # O Rust já vem no Windows do GitHub: aqui, a versão estável mais nova e o que já foi compilado nas
      # rodadas anteriores (as dependências levam alguns minutos na primeira vez).
      - name: Set up Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Reuse the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # A janela do app mostra a interface pelo WebView2, que já vem no Windows 10 e 11, mas pode faltar no
      # Windows Server do GitHub. Sem ele, os testes do app não conseguem abrir a janela: aqui ele é
      # conferido e, se faltar, instalado pelo instalador oficial da Microsoft.
      - name: Make sure WebView2 is installed
        shell: pwsh
        run: |
          $key = 'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          function Get-WebView2Version {
            foreach ($root in 'HKLM:', 'HKCU:') {
              $version = (Get-ItemProperty -Path "$root\$key" -ErrorAction SilentlyContinue).pv
              if ($version -and $version -ne '0.0.0.0') { return $version }
            }
          }
          $version = Get-WebView2Version
          if (-not $version) {
            Write-Host 'WebView2 is missing: installing it.'
            $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
            $version = Get-WebView2Version
          }
          if (-not $version) { throw 'WebView2 could not be installed.' }
          Write-Host "WebView2 $version"

      - name: Run the tests
        run: npm test

      # Se algo falhar, guarda o que o Playwright deixou (erros e telas), para ver na aba Actions.
      - name: Save the app test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
